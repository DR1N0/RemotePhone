// Hand-trimmed subset of the Android Emulator's EmulatorController gRPC
// service, vendored for remotephone's capture and input pipelines.
//
// Source: https://github.com/google/android-emulator-webrtc/blob/master/proto/emulator_controller.proto
// (mirrors https://android.googlesource.com/platform/prebuilts/android-emulator/+/master/linux-x86_64/lib/emulator_controller.proto)
// Fetched: 2026-10-17 (screenshot), extended 2026-10-22 (audio + touch).
// Upstream license: Apache 2.0, (C) The Android Open Source Project.
//
// The upstream file defines dozens of unrelated RPCs (phone/SMS, XR/AR
// glasses, sensors, battery, GPS, clipboard, ...). This file keeps only the
// RPCs remotephone actually calls:
//   - streamScreenshot: video capture
//   - streamAudio: audio capture
//   - sendTouch: multi-touch input (replaces per-event `adb shell input`)
// Field numbers are preserved exactly as upstream for wire compatibility —
// proto3 safely ignores any fields the real emulator sends that aren't
// declared here. To add another RPC later, copy the relevant service method
// and message(s) from the upstream file, preserving field numbers.
syntax = "proto3";

option go_package = "remotephone/internal/worker/transport/emugrpc/proto";

package android.emulation.control;

import "google/protobuf/empty.proto";

service EmulatorController {
    // Streams a series of screenshots in the desired format. A new frame is
    // delivered whenever the device produces a new frame (event-driven, not
    // polled) — see ImageFormat/Image below for the full semantics as
    // documented upstream.
    rpc streamScreenshot(ImageFormat) returns (stream Image) {}

    // Streams audio packets in the desired format, roughly every 20-30ms
    // while the emulated device produces audio. A sampling rate of 0 defaults
    // to 44100 Hz. The stream blocks while the emulator has no audio to send.
    rpc streamAudio(AudioFormat) returns (stream AudioPacket) {}

    // Sends touch events to the emulator. Coordinates are physical pixels of
    // the display. Each Touch's identifier maps to an internal multitouch
    // slot; pressure must be non-zero while touching and zero to lift.
    rpc sendTouch(TouchEvent) returns (google.protobuf.Empty) {}
}

message ImageFormat {
    enum ImgFormat {
        PNG = 0;
        // Each pixel consists of 4 bytes: R, G, B, A.
        RGBA8888 = 1;
        RGB888 = 2;
    }

    // The desired format of the resulting bytes.
    ImgFormat format = 1;

    // The (desired) width of the image. Omitting this value (or passing in
    // 0) will result in no scaling, and the width of the actual device will
    // be used.
    uint32 width = 3;

    // The (desired) height of the image. Same no-scaling behavior as width
    // when omitted/0.
    uint32 height = 4;

    // The (desired) display id of the device. 0 (or omitted) indicates the
    // main display.
    uint32 display = 5;
}

message Image {
    ImageFormat format = 1;

    // The organization of the pixels in the image buffer is from left to
    // right and bottom up.
    bytes image = 4;

    // Monotonically increasing sequence number in the stream. Not
    // necessarily contiguous — can be used to detect dropped frames.
    uint32 seq = 5;

    // Unix timestamp in microseconds when the emulator estimates the frame
    // was generated.
    uint64 timestampUs = 6;
}

message AudioFormat {
    enum SampleFormat {
        AUD_FMT_U8 = 0;  // Unsigned 8 bit
        AUD_FMT_S16 = 1; // Signed 16 bit (little endian)
    }

    enum Channels {
        Mono = 0;
        Stereo = 1;
    }

    enum DeliveryMode {
        MODE_UNSPECIFIED = 0;
        MODE_REAL_TIME = 1;
    }

    // Sampling rate to use, defaulting to 44100 if this is not set.
    uint64 samplingRate = 1;
    Channels channels = 2;
    SampleFormat format = 3;

    // [Input Only] The mode used when delivering audio packets.
    DeliveryMode mode = 4;
}

message AudioPacket {
    AudioFormat format = 1;

    // Unix epoch in us when this frame was captured.
    uint64 timestamp = 2;

    // Contains a sample in the given audio format.
    bytes audio = 3;
}

message Touch {
    // Horizontal coordinate in physical pixels (0 = leftmost).
    int32 x = 1;

    // Vertical coordinate in physical pixels (0 = topmost).
    int32 y = 2;

    // Arbitrary non-negative tracking id, stable for the duration of one
    // finger's contact. Up to 10 concurrent touches are supported.
    int32 identifier = 3;

    // Physical pressure. Must be non-zero while touching and zero to lift —
    // a zero-pressure event is what unregisters the identifier.
    int32 pressure = 4;

    // Optional contact area / longer dimension.
    int32 touch_major = 5;

    // Optional shorter dimension (ignored when touch_major is an area).
    int32 touch_minor = 6;

    enum EventExpiration {
        EVENT_EXPIRATION_UNSPECIFIED = 0;
        NEVER_EXPIRE = 1;
    }

    EventExpiration expiration = 7;

    // Orientation of the contact, if any.
    int32 orientation = 8;
}

// A TouchEvent contains a list of Touch objects in contact with the touch
// surface, delivered in order using Linux multitouch "Protocol B".
message TouchEvent {
    repeated Touch touches = 1;

    // Display device where the touch occurred; 0 (or omitted) is the main
    // display.
    int32 display = 2;
}
