# NOTE: `schema` points at sqlc_schema/, not migrations/, because sqlc
# v1.31.1's SQLite engine has a parser bug: its identifier() helper
# (internal/engine/sqlite/convert.go) only strips double-quote quoting,
# not backtick quoting, so backtick-quoted table/column names (used by
# the drizzle-kit-generated 0000 and 0004 migrations) register in sqlc's
# schema catalog with the backticks still embedded in the name, which
# then fails to match later unquoted ALTER TABLE / query references
# ("relation \"attachments\" does not exist", etc). sqlc has no SQLite
# live-introspection mode to work around this.
#
# sqlc_schema/ is a mirror of migrations/ with backticks rewritten as
# double quotes — semantically identical SQLite identifier quoting, just
# in a form sqlc's parser handles correctly. migrations/ (used by
# ApplyMigrations at runtime) is untouched and remains byte-identical to
# the original TS control-plane migrations.
#
# sqlc_schema/ is GITIGNORED and generated on demand — never hand-edited,
# never committed. It is regenerated by the Makefile every time you run
# `sqlc generate`:
#   make sqlc-generate      # regenerates sqlc_schema/, then runs sqlc generate
#   make sqlc-schema        # regenerates sqlc_schema/ only
# Do not run the bare `sqlc generate` binary directly against this repo —
# use `make sqlc-generate` so sqlc_schema/ can't drift out of sync with
# migrations/.
version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/controlplane/persistence/queries"
    schema: "internal/controlplane/persistence/sqlc_schema"
    gen:
      go:
        package: "repo"
        out: "internal/controlplane/persistence/repo"
        emit_json_tags: true
